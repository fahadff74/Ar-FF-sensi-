:root{--bg:#000;--card:#161616;--red:#ff1e3c;--grn:#2bd96b;--tx:#f2f2f2;--mu:#9a9a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--tx);font-family:"Segoe UI","Noto Sans Bengali",system-ui,sans-serif}
body{padding:12px 12px 90px;max-width:560px;margin:auto}
h1{font:800 20px/1.1 Impact,"Arial Black",sans-serif;letter-spacing:1px;margin:0}h2{font-size:16px;margin:14px 0 8px;color:var(--red)}
.top{display:flex;gap:10px;align-items:center;margin-bottom:10px}.top small{color:var(--mu)}
.card{background:var(--card);border:1px solid #3a0f16;border-radius:12px;padding:12px;margin:8px 0}
.feat{border-color:var(--red);box-shadow:0 0 14px #ff1e3c55}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:700;box-shadow:0 0 10px #ff1e3c88;cursor:pointer;margin:3px 3px 3px 0;font-size:14px}
.btn.g{background:#1d1d1d;box-shadow:none;border:1px solid var(--red)}.big{width:100%;padding:16px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .btn{margin:0;text-align:left}
input,select{width:100%;background:#0c0c0c;color:#fff;border:1px solid #444;border-radius:10px;padding:11px;font-size:15px;margin:4px 0}
input[type=range]{padding:0;accent-color:var(--red)}
.row{display:flex;align-items:center;gap:6px}.row b{width:32px;text-align:center;color:var(--grn)}.row span{width:90px;font-size:13px}
.pm{width:34px;height:34px;border-radius:8px;border:1px solid var(--red);background:#111;color:#fff;font-size:18px}
.chip{display:inline-block;border:1px solid #444;border-radius:20px;padding:6px 11px;margin:3px 3px 3px 0;font-size:13px;cursor:pointer}.chip.on{border-color:var(--red);background:#2a0a10}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0a0a0a;border-top:1px solid var(--red);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:0;border:0;color:var(--mu);padding:14px 0;font-weight:700;font-size:12px}.nav .on{color:var(--red)}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid #262626;padding:5px 0;font-size:13px}.kv span:last-child{color:var(--grn);text-align:right}
.mu{color:var(--mu);font-size:13px}pre{white-space:pre-wrap;font:inherit}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--grn);color:#000;padding:8px 16px;border-radius:20px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.s{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

else if(pg=="chars"){const cb=S.combo||comboOf(S.prof);h+=`<h2>${t("cc")}</h2><div>`+P.map(p=>`<span class="chip ${S.prof==p?"on":""}" onclick="S.prof='${p}';S.combo=null;sv();render()">${t(p)}</span>`).join("")+`</div>`+cb.map((n,i)=>`<div class="card"><div class="row"><b style="width:auto;color:var(--red)">${i?t("pas")+" "+i:t("act")}</b><select onchange="S.combo=[...(S.combo||comboOf(S.prof))];S.combo[${i}]=this.value;sv();render()">`+C.filter(c=>c[2]==(i?"p":"a")).map(c=>`<option ${c[0]==n?"selected":""}>${c[0]}</option>`).join("")+`</select></div>`+(c=>`<div><b>${c[1]}</b> — ${c[3]}<div class="mu">${t("why")}: ${c[4]}</div></div>`)(C.find(c=>c[0]==n))+`</div>`).join("")+`<div class="mu">${t("verify")}</div><button class="btn" onclick="cp(comboTxt(S.prof))">${t("ccc")}</button><button class="btn g" onclick="S.combo=null;sv();render()">${t("reset")}</button>`}
else if(pg=="finger")h+=`<h2>${t("fs")}</h2>`+[2,3,4,5].map(n=>`<div class="card ${S.fing==n?"feat":""}"><b>${n} ${S.lang=="bn"?"ফিঙ্গার":"Finger"}</b><svg viewBox="0 0 120 40" width="100%" height="50"><rect x="1" y="1" width="118" height="38" rx="6" fill="#000" stroke="#444"/>${[...Array(n)].map((_,i)=>`<circle cx="${15+i*(90/Math.max(n-1,1))}" cy="${i%2?28:14}" r="7" fill="#ff1e3c"/>`).join("")}</svg><div class="mu">${FG[n][0]}<br>${FG[n][1]}</div><button class="btn g" onclick="S.fing=${n};gen();render()">${t("add")}</button></div>`).join("");
else if(pg=="dpi")h+=`<h2>${t("dpi")}</h2><div class="card"><p>DPI = display density. Higher DPI makes the interface smaller and gives more room on screen; lower DPI makes everything larger.</p><p class="mu">+ more screen space · − small buttons, harder to tap</p><p>${t("dpin")}</p></div>`;
else if(pg=="fix"){h+=`<h2>${t("fix")}</h2><p class="mu">${t("fa")}</p>`+FX.map((f,i)=>`<div class="card" onclick="fx=${fx==i?-1:i};render()"><b>${S.lang=="bn"?FXB[i]:f[0]}</b>`+(fx==i?`<p>${S.lang=="bn"?FXBE[i]:f[1]+" "+f[2]}</p><div class="mu">${t("checks")}: ${S.lang=="bn"?"একবারে একটি পরিবর্তন করুন":"change one value, test in training"}</div><button class="btn g" onclick="event.stopPropagation();gen();toast('${t("reset")}')">${t("reset")}</button>`:"")+`</div>`).join("")}
else if(pg=="saved"){h+=`<h2>${t("sv")}</h2>`+(S.saved.length?S.saved.map((s,i)=>`<div class="card"><b>${s.n}</b><div class="mu">${t(s.prof)} · ${s.dev?s.dev.model:t("unk")}</div><div>${s.vals.join(" / ")}</div><button class="btn g" onclick="cp(profTxt(S.saved[${i}].prof,S.saved[${i}].vals))">${t("copy")}</button><button class="btn g" onclick="S.prof=S.saved[${i}].prof;S.dev=S.saved[${i}].dev;S.fing=S.saved[${i}].fing;S.fire=S.saved[${i}].fire;S.vals=[...S.saved[${i}].vals];S.combo=S.saved[${i}].combo;S.gd=true;go('gen')">Edit</button><button class="btn g" onclick="const n=prompt('${t("name")}',S.saved[${i}].n);if(n){S.saved[${i}].n=n;sv();render()}">${t("ren")}</button><button class="btn g" onclick="S.saved.splice(${i},1);sv();render()">${t("del")}</button></div>`).join(""):`<div class="card mu">${t("none")}</div>`)}
else if(pg=="set")h+=`<h2>${t("set")}</h2><div class="card"><b>${t("lang")}</b><div><span class="chip ${S.lang=="bn"?"on":""}" onclick="setLang('bn')">🇧🇩 বাংলা</span><span class="chip ${S.lang=="en"?"on":""}" onclick="setLang('en')">🇬🇧 English</span></div></div><div class="card"><b>AR FF SENSI</b><div>ARFEEN SENSI HUB</div><div class="mu">${t("about")}</div></div><button class="btn g" onclick="if(confirm('?')){localStorage.removeItem('arff');location.reload()}">${t("wipe")}</button>`;
if(!["home","gen","chars","set"].includes(pg))h+=`<button class="btn g" onclick="go('home')">← ${t("home")}</button>`;
$("app").innerHTML=h}
document.documentElement.lang=S.lang;render();
</script></body></html>
